<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Mundo Aventura</title>
  <desc id="desc">Un archipiélago de tres islas rodeado por un mar turquesa.</desc>
